# Copy file này vào /etc/nginx/sites-available/chumchat
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/chumchat /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# SSL: certbot sẽ tự sửa file này khi chạy `sudo certbot --nginx -d chat.chumchumbakery.com`

server {
    listen 80;
    server_name chat.chumchumbakery.com;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;

        # Blazor Server chạy trên WebSocket — 2 header Upgrade/Connection là bắt buộc,
        # thiếu là giao diện sẽ đơ (kết nối SignalR không mở được)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Giữ kết nối WebSocket lâu, tránh bị cắt sau 60s mặc định
        proxy_read_timeout 100s;
    }
}
